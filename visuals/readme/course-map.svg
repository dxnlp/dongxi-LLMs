<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="382" viewBox="0 0 1120 382" role="img" aria-labelledby="title description">
  <title id="title">The Dongxi LLMs learning journey</title>
  <desc id="description">Four connected stages cover chapters one through fifteen and days one through twenty-eight: build a decoder, train and evaluate, learn preferences and policies, then diagnose and defend. Chapters are paired with worked solutions, visual notebooks, and experiments.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#77847f" stroke-width="1.3"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .eyebrow { fill: #52665d; font-size: 14px; letter-spacing: 2px; font-weight: 600; }
      .heading { fill: #182b23; font-size: 25px; font-weight: 600; }
      .detail { fill: #526159; font-size: 17px; }
      .scope { fill: #66756d; font-size: 15px; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="1119" height="381" rx="12" fill="#fafbf8" stroke="#e1e6df"/>
  <text x="36" y="39" class="eyebrow">THE COURSE, FROM FIRST PRINCIPLES TO EXPERIMENTAL JUDGMENT</text>
  <line x1="36" y1="63" x2="1084" y2="63" stroke="#e1e6df"/>

  <circle cx="55" cy="106" r="19" fill="#e5eee7"/>
  <text x="55" y="112" text-anchor="middle" fill="#315740" font-size="16" font-weight="600">1</text>
  <line x1="82" y1="106" x2="283" y2="106" stroke="#b7c3ba" marker-end="url(#arrow)"/>
  <text x="36" y="159" class="heading">Build a decoder</text>
  <text x="36" y="194" class="detail">Tokens, gradients, attention</text>
  <text x="36" y="221" class="detail">A model you can inspect</text>
  <text x="36" y="267" class="scope">Chapters 1–5 · Days 1–7</text>

  <circle cx="323" cy="106" r="19" fill="#e5eee7"/>
  <text x="323" y="112" text-anchor="middle" fill="#315740" font-size="16" font-weight="600">2</text>
  <line x1="350" y1="106" x2="551" y2="106" stroke="#b7c3ba" marker-end="url(#arrow)"/>
  <text x="304" y="159" class="heading">Train and evaluate</text>
  <text x="304" y="194" class="detail">Pretraining, instruction, SFT</text>
  <text x="304" y="221" class="detail">Measure what changed</text>
  <text x="304" y="267" class="scope">Chapters 6–9 · Days 8–14</text>

  <circle cx="591" cy="106" r="19" fill="#e5eee7"/>
  <text x="591" y="112" text-anchor="middle" fill="#315740" font-size="16" font-weight="600">3</text>
  <line x1="618" y1="106" x2="819" y2="106" stroke="#b7c3ba" marker-end="url(#arrow)"/>
  <text x="572" y="159" class="heading">Preferences and RL</text>
  <text x="572" y="194" class="detail">Rewards, DPO, policy gradients</text>
  <text x="572" y="221" class="detail">Understand the objective</text>
  <text x="572" y="267" class="scope">Chapters 10–12 · Days 15–21</text>

  <circle cx="859" cy="106" r="19" fill="#e5eee7"/>
  <text x="859" y="112" text-anchor="middle" fill="#315740" font-size="16" font-weight="600">4</text>
  <text x="840" y="159" class="heading">Diagnose and defend</text>
  <text x="840" y="194" class="detail">GRPO, failures, distillation</text>
  <text x="840" y="221" class="detail">Build a defensible conclusion</text>
  <text x="840" y="267" class="scope">Chapters 13–15 · Days 22–28</text>

  <line x1="36" y1="303" x2="1084" y2="303" stroke="#e1e6df"/>
  <text x="36" y="346" fill="#315740" font-size="18" font-weight="600">Each stage connects</text>
  <text x="246" y="346" class="detail">Chapter + worked solutions</text>
  <circle cx="487" cy="340" r="2" fill="#a6b4aa"/>
  <text x="511" y="346" class="detail">Visual notebook</text>
  <circle cx="664" cy="340" r="2" fill="#a6b4aa"/>
  <text x="688" y="346" class="detail">Experiment + evidence</text>
</svg>
