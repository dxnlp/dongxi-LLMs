<p>A：先看原方案。B：要求预算减半，输入文档仍是原方案。C：输入已经修改后的方案，再次检查。</p>
<details><summary>如何理解这段动画</summary><p>Prefill 计算输入，KV cache 保存 K/V 状态，prefix caching 复用相同前缀的状态。新指令仍需处理，新回答仍需生成。</p>
<p>图中是一层的输入片段和缓存示意，未实际运行 tokenizer 或模型。复用以完整输入中的实际 token 前缀为准，并假设模型、位置处理、执行设置一致且缓存仍可用。重算后缀不代表每个数值都必然变化。顺序出现的方块用于解释计算，不表示实际 prefill 调度顺序。</p></details>
