<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inference GIFs</title><style>
body{margin:0;background:#f1f5f9;font:15px/1.5 -apple-system,Arial,sans-serif;color:#111827}
main{max-width:1320px;margin:0 auto;padding:24px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(560px,1fr));gap:20px}
h1{max-width:1320px;margin:24px auto 0;padding:0 16px;font-size:22px}
figure{margin:0;background:#fff;border:1px solid #cbd5e1;border-radius:10px;overflow:hidden}
figcaption{padding:10px 14px;color:#334155} img{width:100%;display:block;border-top:1px solid #e2e8f0}
@media(max-width:600px){main{grid-template-columns:1fr}}</style></head>
<body><h1>Inference: from a prompt to text · 7 GIFs (review)</h1><main><figure><figcaption><b>01 · From prompt to text</b><br>Tokenize once; then one forward pass per output token: logits → pick → append. Nine passes write the reply; &lt;|im_end|&gt; stops it.</figcaption><img src="rendered/01-overview/01-overview.gif" alt="From prompt to text" loading="lazy"></figure><figure><figcaption><b>02 · The chat template</b><br>The question is wrapped in role markers and special tokens; the answer starts on the empty line after &quot;assistant&quot;.</figcaption><img src="rendered/02-chat-template/02-chat-template.gif" alt="The chat template" loading="lazy"></figure><figure><figcaption><b>03 · Tokenize</b><br>The text is cut into vocabulary entries; each becomes its row number (real Qwen3 IDs). The model receives only the 13 numbers.</figcaption><img src="rendered/03-tokenize/03-tokenize.gif" alt="Tokenize" loading="lazy"></figure><figure><figcaption><b>04 · Prefill</b><br>IDs select embedding rows; all 13 positions pass the layers together and leave K, V behind; only the last position reaches the LM head: 151,936 logits.</figcaption><img src="rendered/04-prefill/04-prefill.gif" alt="Prefill" loading="lazy"></figure><figure><figcaption><b>05 · Pick the next token</b><br>Softmax, temperature, top-p 0.9; greedy always takes Part, sampling gives Part, Open, Part, No, Part. Illustrative numbers.</figcaption><img src="rendered/05-pick-token/05-pick-token.gif" alt="Pick the next token" loading="lazy"></figure><figure><figcaption><b>06 · Decode</b><br>Each pass feeds only the newest token; it reads the cache in every layer and adds its own K, V. The picked token drops back in as the next input.</figcaption><img src="rendered/06-decode-loop/06-decode-loop.gif" alt="Decode" loading="lazy"></figure><figure><figcaption><b>07 · Detokenize</b><br>IDs are looked up in reverse; the stop token is dropped, ␣ becomes a space, and the pieces join into the reply.</figcaption><img src="rendered/07-detokenize/07-detokenize.gif" alt="Detokenize" loading="lazy"></figure></main></body></html>
