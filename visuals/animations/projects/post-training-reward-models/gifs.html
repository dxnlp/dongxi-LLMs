<body><h1>Reward models (X-POST-005) · 11 GIFs (review)</h1><main><figure><figcaption><b>01 · One choice, one row</b><br>A person picks A over B. The choice becomes one row: prompt, chosen, rejected. Rows stack into the training set of a reward model.</figcaption><img src="rendered/01-one-click/01-one-click.gif" alt="One choice, one row" loading="lazy"></figure><figure><figcaption><b>02 · Bradley–Terry</b><br>Two scores; only the gap matters (+10 to both changes nothing). The sigmoid turns gap −1 into 0.27; loss 1.31. Each step raises A and lowers B by 1 − σ(gap): gap −1 → +2, loss 1.31 → 0.13.</figcaption><img src="rendered/02-bradley-terry/02-bradley-terry.gif" alt="Bradley–Terry" loading="lazy"></figure><figure><figcaption><b>03 · Where the push goes</b><br>Twelve pairs on the gap axis. The push 1 − σ(gap) is large on pairs in the wrong order and fades on pairs ranked right. A vs B: gap 0 → 1.0, loss 0.693 → 0.313, push 0.5 → 0.269.</figcaption><img src="rendered/03-gradient-push/03-gradient-push.gif" alt="Where the push goes" loading="lazy"></figure><figure><figcaption><b>04 · Chat model: the LM head</b><br>h sits above the LM head, column over column; each logit is h · one row: Part 2.0, Yes 1.0, No −1.0, one of 151,936 rows each. Softmax, pick a token, and the loop runs again.</figcaption><img src="rendered/04-chat-head/04-chat-head.gif" alt="Chat model: the LM head" loading="lazy"></figure><figure><figcaption><b>05 · Reward model: one head row</b><br>Same body, one row in the head: h · that row is the score, 2.0 for A. Answer B takes its own pass and scores 1.0. A &gt; B.</figcaption><img src="rendered/05-score-head/05-score-head.gif" alt="Reward model: one head row" loading="lazy"></figure><figure><figcaption><b>06 · Which position gives the score</b><br>The score head gives a number at every token. Changing Some to All leaves earlier numbers the same and changes every later one. The last token has read the whole answer: its number is the score.</figcaption><img src="rendered/06-last-token/06-last-token.gif" alt="Which position gives the score" loading="lazy"></figure><figure><figcaption><b>07 · Chat model: softmax over all tokens</b><br>One pass gives logits for every vocabulary entry; softmax turns each column into a probability (0.705 / 0.259 / 0.035, sum 1); one token is sampled. Training: −log p(next token).</figcaption><img src="rendered/07-chat-softmax/07-chat-softmax.gif" alt="Chat model: softmax over all tokens" loading="lazy"></figure><figure><figcaption><b>08 · Reward model: a two-way softmax</b><br>One pass per answer, one score each. Softmax over the two answers gives 0.731 / 0.269 = σ(1), used only in the loss −log p(A). In use, the raw score goes out as the reward.</figcaption><img src="rendered/08-pair-softmax/08-pair-softmax.gif" alt="Reward model: a two-way softmax" loading="lazy"></figure><figure><figcaption><b>09 · Random noise vs systematic bias</b><br>Two learned weights, on accurate and on long. Random flips point both ways: both shrink, same ratio. Flips that always favour the longer answer add up: the weight on length grows. More data of the same kind changes neither.</figcaption><img src="rendered/09-noise-vs-bias/09-noise-vs-bias.gif" alt="Random noise vs systematic bias" loading="lazy"></figure><figure><figcaption><b>10 · A proxy, optimized</b><br>A longer answer with no new content scores higher. Optimized against, the reward model score keeps rising while true quality rises, peaks and falls: reward hacking. Illustrative shape after Gao et al. (2022).</figcaption><img src="rendered/10-proxy/10-proxy.gif" alt="A proxy, optimized" loading="lazy"></figure><figure><figcaption><b>11 · One reward model, three uses</b><br>Frozen, it only scores: best-of-n keeps the top answer; labeling turns two scored answers into a new row; in RLHF the score is the reward that updates the policy.</figcaption><img src="rendered/11-three-uses/11-three-uses.gif" alt="One reward model, three uses" loading="lazy"></figure></main></body></html>
