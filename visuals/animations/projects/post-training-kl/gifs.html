<body><h1>KL article · 12 GIFs (review)</h1><main><figure><figcaption><b>01 · One question, five answers</b><br>The reference's five shares, then 0.10 moves from the vague answer to the best answer. Illustrative probabilities.</figcaption><img src="rendered/01-two-splits/01-two-splits.gif" alt="One question, five answers" loading="lazy"></figure><figure><figcaption><b>02 · Why a log</b><br>A ratio dial and the log curve: 1 goes to 0, doubling and halving land at +0.693 and −0.693, and the curve falls without limit near 0.</figcaption><img src="rendered/02-why-log/02-why-log.gif" alt="Why a log" loading="lazy"></figure><figure><figcaption><b>03 · KL, term by term</b><br>Ratio, log, weight by the new model, add: −0.086 + 0.133 = 0.047. The formula assembles symbol by symbol above the columns.</figcaption><img src="rendered/03-kl-term-by-term/03-kl-term-by-term.gif" alt="KL, term by term" loading="lazy"></figure><figure><figcaption><b>04 · What the number means</b><br>Replies arrive one at a time and each adds its log-ratio to the evidence. At KL 0.047 the total reaches 3.0, or 20-to-1 odds, after about 64 replies on average.</figcaption><img src="rendered/04-evidence/04-evidence.gif" alt="What the number means" loading="lazy"></figure><figure><figcaption><b>05 · Why KL is never negative</b><br>Gains add to 0; every term is at least its gain, so the terms add to at least 0. A drop to 0.01 has log-ratio −3.689, but its term is only −0.037.</figcaption><img src="rendered/05-never-negative/05-never-negative.gif" alt="Why KL is never negative" loading="lazy"></figure><figure><figcaption><b>06 · KL has no direction</b><br>Toward and away from the best answer both cost KL (0.047 and 0.076). The reward separates them (0.638 and 0.209), and β sets how far the best answer's share rises.</figcaption><img src="rendered/06-no-direction/06-no-direction.gif" alt="KL has no direction" loading="lazy"></figure><figure><figcaption><b>07 · Same move, different price</b><br>The same 0.10 moved to a common answer and to a rare one: share moved 0.10 both times, KL 0.031 and 0.233.</figcaption><img src="rendered/07-rare-moves/07-rare-moves.gif" alt="Same move, different price" loading="lazy"></figure><figure><figcaption><b>08 · Which model goes on top</b><br>The two orders of KL: 0.047 and 0.042 for the small move; dropping an answer costs 0.102 one way and is infinite the other.</figcaption><img src="rendered/08-which-way/08-which-way.gif" alt="Which model goes on top" loading="lazy"></figure><figure><figcaption><b>09 · KL from samples</b><br>The new model writes replies, each drops its log-ratio, and the running average settles near 0.047. One simulated run.</figcaption><img src="rendered/09-from-samples/09-from-samples.gif" alt="KL from samples" loading="lazy"></figure><figure><figcaption><b>10 · KL, token by token</b><br>A reply's log-ratio splits over its tokens: 0.223 + 0 + 0.182 = 0.405, and the two places PPO and GRPO put it. Illustrative probabilities.</figcaption><img src="rendered/10-tokens/10-tokens.gif" alt="KL, token by token" loading="lazy"></figure><figure><figcaption><b>11 · Reading KL in a run</b><br>As KL grows, the reward keeps rising while gold peaks at 1.10 at KL 0.81 and falls. Toy example; each point is the best compromise at a smaller β.</figcaption><img src="rendered/11-reading-a-run/11-reading-a-run.gif" alt="Reading KL in a run" loading="lazy"></figure><figure><figcaption><b>12 · The log-ratio is also a reward</b><br>At the best compromise every log-ratio equals the reward minus 0.808. In a comparison the constant cancels: 0.731 either way.</figcaption><img src="rendered/12-implicit-reward/12-implicit-reward.gif" alt="The log-ratio is also a reward" loading="lazy"></figure></main></body></html>
