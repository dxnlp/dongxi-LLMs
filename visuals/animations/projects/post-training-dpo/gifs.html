<body><h1>DPO article · 13 GIFs (review)</h1><main><figure><figcaption><b>00a · The long way and the shortcut</b><br>RLHF goes from human pairs through a reward model and RL to the chat model; DPO goes straight there with one loss on stored pairs.</figcaption><img loading="lazy" src="rendered/00a-two-routes/00a-two-routes.gif" alt="The long way and the shortcut"></figure><figure><figcaption><b>00b · The change is the score</b><br>As the model&#x27;s shares move away from the dashed reference, each answer&#x27;s score moves with them: raised answers above 0, lowered answers below 0, unchanged answers 0. Illustrative numbers.</figcaption><img loading="lazy" src="rendered/00b-change-is-the-score/00b-change-is-the-score.gif" alt="The change is the score"></figure><figure><figcaption><b>01 · Your model is secretly a reward model</b><br>Left, a separate reward model with a score head. Right, the trained model and the frozen reference read the same answer, and ratio, log and β give its score: 0.606 for the best answer after the small move. Illustrative probabilities.</figcaption><img loading="lazy" src="rendered/01-secretly-a-reward-model/01-secretly-a-reward-model.gif" alt="Your model is secretly a reward model"></figure><figure><figcaption><b>02 · Three signals, two jobs</b><br>Reward and KL enter the update; gold only judges checkpoints. In DPO, stored pairs replace the reward model.</figcaption><img loading="lazy" src="rendered/02-three-signals/02-three-signals.gif" alt="Three signals, two jobs"></figure><figure><figcaption><b>03 · Why pay for distance</b><br>With reward alone, all share flows to the overrated answer: reward 3, gold −2. With β = 1 it gets 4.3%: reward 1.22, gold 1.00. Toy example.</figcaption><img loading="lazy" src="rendered/03-why-pay-for-distance/03-why-pay-for-distance.gif" alt="Why pay for distance"></figure><figure><figcaption><b>04 · The best model: no move helps</b><br>Five net-value bars level at 0.808, then the recipe: multiply by e^reward, add to Z = 2.243, divide.</figcaption><img loading="lazy" src="rendered/04-no-move-helps/04-no-move-helps.gif" alt="The best model: no move helps"></figure><figure><figcaption><b>05 · The log-ratio is also a reward</b><br>At the best model every log-ratio equals the reward minus 0.808. In a comparison the constant cancels: 0.731 either way.</figcaption><img loading="lazy" src="rendered/05-implicit-reward/05-implicit-reward.gif" alt="The log-ratio is also a reward"></figure><figure><figcaption><b>06 · The DPO loss on one pair</b><br>The gap sweeps from −3 to 3 and the loss curve draws itself, with the egg pair marked at 0.693, 0.435 and 0.313.</figcaption><img loading="lazy" src="rendered/06-loss-on-one-pair/06-loss-on-one-pair.gif" alt="The DPO loss on one pair"></figure><figure><figcaption><b>07 · The push</b><br>A nudge test, then arrows sized by the push: 0.953, 0.500 and 0.047. One pair trained step by step, with steps that shrink and never stop.</figcaption><img loading="lazy" src="rendered/07-the-push/07-the-push.gif" alt="The push"></figure><figure><figcaption><b>08 · Where the probability comes from</b><br>One step moves only the pair&#x27;s two logits; all five shares change. The wrong answer rises from 8.0% to 8.2%, and the bars differ from π\*.</figcaption><img loading="lazy" src="rendered/08-where-probability-comes-from/08-where-probability-comes-from.gif" alt="Where the probability comes from"></figure><figure><figcaption><b>09 · The ideal test</b><br>Who-won records arrive with the rewards hidden. Training on 1,000 of them moves the shares from the reference to the target, and the distance goes from 0.33 to 0.05. Simulated data; the bars are one run&#x27;s shares.</figcaption><img loading="lazy" src="rendered/09-ideal-test/09-ideal-test.gif" alt="The ideal test"></figure><figure><figcaption><b>10 · From answers to tokens</b><br>Answer tokens and the end-of-turn token add up; prompt tokens are not counted. A longer reply has a lower total, so each answer is compared with its own reference value. Illustrative values.</figcaption><img loading="lazy" src="rendered/10-answers-to-tokens/10-answers-to-tokens.gif" alt="From answers to tokens"></figure><figure><figcaption><b>11 · What to watch on a real model</b><br>Four things to watch: training and held-out accuracy from 50%, chosen and rejected probabilities, a run where both fall, and KL measured from samples. Invented curves, no measured values.</figcaption><img loading="lazy" src="rendered/11-what-to-watch/11-what-to-watch.gif" alt="What to watch on a real model"></figure></main></body></html>
