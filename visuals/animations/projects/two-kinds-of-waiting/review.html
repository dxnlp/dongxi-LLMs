<details><summary>如何理解这个例子</summary><p>TTFT（Time to First Token）：从请求发出，到首个输出 token 到达。ITL（Inter-Token Latency）：相邻两个输出 token 到达之间的间隔。橙色线在“上线”出现时停止；随后每段绿色线都从上一个输出到达开始，到下一个输出到达结束。</p><p>每张词语卡片代指一次 token 到达，分词与时长均为示意，未运行 tokenizer 或模型。TTFT 还可能包含排队、采样与传输等开销，不能直接等同于 prefill 计算时间。此动画简化了服务和网络细节。</p></details>
