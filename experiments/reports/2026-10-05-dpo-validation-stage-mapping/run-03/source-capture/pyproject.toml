[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dongxi-llms"
version = "0.1.0"
description = "Executable companions to the Dongxi LLMs technical book"
requires-python = ">=3.11"
dependencies = ["torch>=2.6,<3", "numpy>=1.26,<3"]

[project.optional-dependencies]
course = [
    "matplotlib==3.10.8",
    "nbformat>=5.10,<6",
    "nbclient>=0.10,<1",
    "ipykernel>=6.29,<8",
    "jupyterlab>=4.3,<5",
    "PyYAML>=6,<7",
    "psutil>=7,<8",
    "transformers>=5.16,<6",
    "tokenizers>=0.23,<0.24",
    "peft>=0.20,<0.21",
]

# The teaching lock intentionally resolves Linux to CPU wheels even on Spark.
# Mac CPU wheels come from PyPI. This lock never replaces the Spark GPU lock.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.setuptools.packages.find]
where = ["src"]
