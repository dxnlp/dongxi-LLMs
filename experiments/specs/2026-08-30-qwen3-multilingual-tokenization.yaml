id: 2026-08-30-qwen3-multilingual-tokenization
title: Qwen3 multilingual tokenization exploration
mode: learning
status: planned

question: >
  How does the Qwen3-0.6B tokenizer represent approximately equivalent English,
  Chinese, and Swedish sentences, and how should multilingual token efficiency be
  measured?
hypothesis:
  ranking_from_fewest_to_most: Swedish, Chinese, English
  chinese: >
    Chinese is character-based, so its token count should be approximately equal
    to the sentence length including punctuation; it should rank in the middle.
  swedish: >
    Swedish and English should be similar, but Swedish compounds can express in
    one written word what English expresses in multiple words, so Swedish should
    use fewer tokens than English.

identity:
  model_family: Qwen3
  tokenizer:
    name: Qwen/Qwen3-0.6B
    revision: c1899de289a04d12100db370d81485cdf75e47ca
  environment_manifest: manifests/2026-08-29-dgx-spark-native.json

inputs:
  english: The small language model learns to predict the next token.
  chinese: 小型语言模型学习预测下一个词元。
  swedish: Den lilla språkmodellen lär sig att förutsäga nästa token.

configuration:
  add_special_tokens: false
  return_attention_mask: false
  normalization: tokenizer_default

measurements:
  - Unicode code-point count
  - UTF-8 byte count
  - token count
  - code points per token
  - UTF-8 bytes per token
  - token IDs and vocabulary pieces
  - exact encode/decode round trip

success_criteria:
  - The pinned tokenizer loads successfully.
  - Token IDs and vocabulary pieces are preserved for every input.
  - Every input decodes exactly to its original text.
  - Counts and efficiency ratios are computed mechanically.
  - Predictions are compared with observations without rewriting them.

claims_not_tested:
  - general token efficiency for an entire language
  - semantic equivalence of every translation nuance
  - downstream model quality in any language
  - tokenizer optimality relative to other model families

notes: >
  A single sentence per language is a worked example, not a representative corpus.
  Character counts use Unicode code points, not grapheme clusters. Token counts do
  not include model-specific chat-template or special-token overhead.
