id: 2026-08-31-qwen3-embedding-inspection
title: Pinned Qwen3 embedding and vocabulary-boundary inspection
mode: learning
status: planned

provenance: >
  This reproducibility protocol was written after a read-only exploratory
  inspection exposed the relevant configuration values. It is not presented as
  a precommitted hypothesis test; its purpose is to verify and preserve exact
  model-interface facts.

question: >
  How do the pinned tokenizer size, model embedding shape, output-logit shape,
  and runtime input/output parameter identity relate?

identity:
  model:
    name: Qwen/Qwen3-0.6B
    revision: c1899de289a04d12100db370d81485cdf75e47ca
  environment_manifest: manifests/2026-08-29-dgx-spark-native.json
  python_executable: /home/dongxi/dgx-spark-dongxi/.venv/bin/python

configuration:
  local_files_only: true
  dtype: checkpoint_default
  device: cpu
  forward_input: eos_token_id

measurements:
  - tokenizer base and total vocabulary sizes
  - maximum tokenizer-assigned ID
  - model configuration vocabulary size and hidden width
  - input and output weight shapes
  - Python parameter-object and storage-pointer identity
  - output logits width for one token
  - tokenizer lookup at the assigned/unassigned boundary

success_criteria:
  - The exact pinned tokenizer and model load from the local cache.
  - All requested identities and shapes are recorded mechanically.
  - The one-token forward pass produces finite logits.
  - The relationship between tokenizer entries and model rows is reported
    without assuming why any extra rows exist.

claims_not_tested:
  - why the model vocabulary size was selected
  - whether extra rows improve hardware performance
  - training-time probability mass assigned to unassigned IDs
  - semantic quality or model capability

