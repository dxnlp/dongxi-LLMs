id: 2026-08-31-tokenizer-mechanics
title: Transparent BPE, Unicode, preprocessing, and chat-template mechanics
mode: learning
status: completed

question: >
  Can a small deterministic trace make BPE training and frozen encoding visible,
  and how do Unicode normalization, grapheme boundaries, leading spaces, and a
  Qwen3 chat template change the units seen by a tokenizer?

hypothesis:
  tiny_bpe: >
    For the weighted corpus hug=5, hugs=3, hugging=2, deterministic tie breaking
    will select h+u, then hu+g, then hug+s with counts 10, 10, and 3.
  normalization: >
    NFC café will contain four code points and NFD cafe plus combining acute will
    contain five, while both contain four extended grapheme clusters. The pinned
    tokenizer may segment the two forms differently but must round-trip both.
  grapheme: >
    The family emoji will be one extended grapheme cluster composed from seven
    code points and 25 UTF-8 bytes.
  leading_space: >
    Adding a leading space will change the first tokenizer piece or ID.
  chat_template: >
    Rendering one user message with a generation prompt will add control syntax
    and therefore more token IDs than encoding the message text alone.

identity:
  tokenizer:
    name: Qwen/Qwen3-0.6B
    revision: c1899de289a04d12100db370d81485cdf75e47ca

inputs:
  bpe_corpus:
    hug: 5
    hugs: 3
    hugging: 2
  normalized_word: café
  grapheme_example: 👨‍👩‍👧‍👦
  leading_space_examples:
    without_space: token
    with_space: " token"
  raw_chat_text: Hello
  messages:
    - role: user
      content: Hello

configuration:
  bpe_base_symbols: Unicode characters for readable teaching
  bpe_pre_tokenization: one word per corpus entry; no cross-word merges
  bpe_merge_rounds: 3
  bpe_tie_break: lexicographic pair order
  tokenizer_add_special_tokens_for_text_examples: false
  chat_template_add_generation_prompt: true

success_criteria:
  - Pair counts, selected merges, and rewritten corpus are preserved for all rounds.
  - Frozen encoding replays the learned merge order without changing the vocabulary.
  - Unicode code points, UTF-8 bytes, and grapheme clusters are computed mechanically.
  - NFC and NFD forms both decode exactly to their original source strings.
  - Leading-space and raw-versus-chat tokenizations preserve pieces and IDs.
  - The exact tokenizer name, revision, library versions, and raw output are recorded.

claims_not_tested:
  - reconstruction of Qwen tokenizer training history
  - language-wide tokenizer efficiency
  - model understanding or generation quality
  - relative quality of BPE, WordPiece, and Unigram
  - chat-template behavior for other models or revisions

execution:
  working_directory: /Users/yongchao/dongxi-LLMs
  command: >-
    PYTHONPATH=src uv run --with transformers==5.16.1 --with tokenizers==0.23.1
    --with regex==2026.1.15 --with pyyaml==6.0.1
    python -m dongxi_llms.tokenizer_mechanics_lab
    --output experiments/results/2026-08-31-tokenizer-mechanics.json
  expected_outputs:
    - experiments/results/2026-08-31-tokenizer-mechanics.json

notes: >
  This is a CPU-only tokenizer experiment. AutoTokenizer downloads tokenizer
  artifacts only; no model weights or DGX Spark resources are required.
