<body><h1>X-POST-004 · RL terms for LLMs · 13 GIFs (review)</h1><main><figure><figcaption><b>01 · One score, thousands of tokens</b><br>DeepSeek-R1-Zero: a rule checks only the final answer; AIME 2024 pass@1 rose from 15.6% to 71.0% (published). Token grid is schematic.</figcaption><img src="assets/01-one-score.gif" alt="One score, thousands of tokens" loading="lazy"></figure><figure><figcaption><b>02 · The RL loop</b><br>The LLM (agent) gets a prompt from the environment, writes an answer, and the judge returns a reward that updates the policy.</figcaption><img src="assets/02-rl-loop.gif" alt="The RL loop" loading="lazy"></figure><figure><figcaption><b>03 · State, action, trajectory</b><br>State = prompt + tokens so far; the policy gives next-token probabilities; the sampled token is the action; the full answer is a trajectory.</figcaption><img src="assets/03-state-action.gif" alt="State, action, trajectory" loading="lazy"></figure><figure><figcaption><b>04 · Reward and return</b><br>Reward is 0 on every token and the judge score on the last (sparse). With γ = 1 the return at every position is that score.</figcaption><img src="assets/04-reward-return.gif" alt="Reward and return" loading="lazy"></figure><figure><figcaption><b>05 · Value, Q and advantage</b><br>The state sits on its value line. All ten scores average to V = 4.3; each branch's scores average to its Q (2, 5, 9); A = Q − V.</figcaption><img src="assets/05-value-q-advantage.gif" alt="Value, Q and advantage" loading="lazy"></figure><figure><figcaption><b>06 · Baseline</b><br>Same frame as 05. Measured from 0, every arrow points up; the reference rises to V = 4.3 and lands on the state, and only better-than-usual answers stay up.</figcaption><img src="assets/06-baseline.gif" alt="Baseline" loading="lazy"></figure><figure><figcaption><b>07 · Credit assignment</b><br>V drops where "open" is written: the TD error puts the blame there (λ = 0); λ = 1 spreads it over every earlier token.</figcaption><img src="assets/07-credit-assignment.gif" alt="Credit assignment" loading="lazy"></figure><figure><figcaption><b>08 · Policy gradient</b><br>Branch thickness moves with the advantage; the state and its V line rise (4.3 → 6.5 → 8.3), and "closed" turns from above to below average.</figcaption><img src="assets/08-policy-gradient.gif" alt="Policy gradient" loading="lazy"></figure><figure><figcaption><b>09 · Exploration</b><br>Greedy only takes the thickest branch: Q of the others stays unknown, A = 0, nothing moves. Sampling tries every branch and the branches move.</figcaption><img src="assets/09-exploration.gif" alt="Exploration" loading="lazy"></figure><figure><figcaption><b>10 · Ratio and clipping</b><br>A = +4.7 pushes π(partly) from 20% to 24%; ρ = π / π_old reaches 1 + ε (ε = 0.2) and the push stops.</figcaption><img src="assets/10-ratio-clip.gif" alt="Ratio and clipping" loading="lazy"></figure><figure><figcaption><b>11 · KL penalty</b><br>π (blue) drifts from π_ref (grey) toward flattery: the judge rises to 9.54, β·KL to 2.38, and R − β·KL falls from 9.03 to 7.16.</figcaption><img src="assets/11-kl-penalty.gif" alt="KL penalty" loading="lazy"></figure><figure><figcaption><b>12 · Term map</b><br>The whole loop on one picture: state, policy, action, reward, V, Q, A, and the update that reshapes the branches.</figcaption><img src="assets/12-term-map.gif" alt="Term map" loading="lazy"></figure><figure><figcaption><b>13 · Term cards</b><br>Quick reference: the loop in five steps (sample, score, compare, assign credit, update) with every term of the article pinned to its step.</figcaption><img src="assets/13-term-cards.gif" alt="Term cards" loading="lazy"></figure></main></body></html>
