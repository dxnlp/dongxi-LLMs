[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dongxi-llms"
version = "0.1.0"
description = "Executable companions to the Dongxi LLMs technical book"
requires-python = ">=3.11"
dependencies = ["torch>=2.6,<3", "numpy>=1.26,<3"]

[tool.setuptools.packages.find]
where = ["src"]
